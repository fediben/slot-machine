name = "slot-kiosk-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Run: npx wrangler d1 create slot-kiosk-db
# Replace this placeholder with the database_id returned by Cloudflare.
[[d1_databases]]
binding = "DB"
database_name = "slot-kiosk-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
APP_MODE = "production"
